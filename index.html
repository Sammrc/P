<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio</title>
    <style>
    
        body {
            background-color: #f4f1ea; 
            color: #2c2a29; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .logo-esquina {
            position: fixed; 
            top: 20px;
            left: 25px;
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 12px; 
            
            border: 2px solid #d4cec3;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            z-index: 1100; 
        }
        
       
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e3ded5; 
            padding: 12px 25px;
            margin: 25px auto;
            width: 60%;
            max-width: 500px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); 

            position: sticky;
            top: 20px;
            z-index: 1000;
        }
        
        .nav-links {
            list-style: none;
            display: flex;
            gap: 15px;
            margin: 0;
            padding: 0;
        }

        .nav-links button {
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: none;
            color: #4a4543;
            font-weight: 600;
            font-size: 1rem;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .nav-links button:hover, .nav-links button.active {
            background-color: #d4cec3;
            color: #1f1d1c;
        }

        main {
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
        }

        .page-section {
            display: none; 
        }
        
        .page-section.active-page {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
       h1, h2 {
            color: #1f1d1c;
        }
    </style>
</head>
<body>

<img src="img/logoIbero.png" alt="Logo Ibero" class="logo-esquina">
    
    <nav>
        <ul class="nav-links">
            <li><button onclick="cambiarPagina('inicio')" id="btn-inicio" class="active">Inicio</button></li>
            <li><button onclick="cambiarPagina('proyectos')" id="btn-proyectos">Proyectos</button></li>
            <li><button onclick="cambiarPagina('acerca')" id="btn-acerca">Acerca de</button></li>
        </ul>
    </nav>


<main>
    
        <section id="inicio" class="page-section active-page">
            <h1>Portafolio de Proyectos</h1>
            <p>...</p>
        </section>


        <section id="proyectos" class="page-section">
            <h2>Mis Proyectos</h2>
            <p>....</p>
        </section>

    
        <section id="acerca" class="page-section">
            <h2>Acerca del Equipo</h2>
            <p>...</p>
        </section>
    </main>

 
    <script>
        function cambiarPagina(idSeccion) {
            const secciones = document.querySelectorAll('.page-section');
            secciones.forEach(sec => sec.classList.remove('active-page'));

            const botones = document.querySelectorAll('.nav-links button');
            botones.forEach(btn => btn.classList.remove('active'));

            document.getElementById(idSeccion).classList.add('active-page');
            document.getElementById('btn-' + idSeccion).classList.add('active');
        }
    </script>

</body>
</html>
